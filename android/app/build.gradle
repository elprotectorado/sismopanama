plugins { id 'com.android.application' }
def vcString = System.getenv('VERSION_CODE') ?: '1'
def vc = vcString.isInteger() ? Integer.parseInt(vcString) : 1
android {
  namespace 'pa.istmo.sismo'
  compileSdk 34
  defaultConfig {
    applicationId 'pa.istmo.sismo'
    minSdk 21
    targetSdk 34
    versionCode = vc
    versionName = "1.0.${vc}"
  }
  signingConfigs {
    release {
      storeFile file(System.getenv('KEYSTORE_PATH') ?: 'istmo.keystore')
      storePassword System.getenv('KS_PASS')
      keyAlias 'istmo'
      keyPassword System.getenv('KS_PASS')
    }
  }
  buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
  compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}
dependencies { implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0' }
